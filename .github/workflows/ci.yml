name: Monorepo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/volume-toolkit
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install toolkit development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test toolkit
        run: python -m pytest tests/ -q
      - name: Check imports
        run: python -c "from ideal_poly_volume_toolkit import geometry, rivin_delaunay"
      - name: Construct existing GUI and application adapters
        if: matrix.python-version == '3.14'
        run: |
          python -c "from bin.gui import create_gui; assert create_gui() is not None"
          python -c "import app; assert app.demo is not None"

  data-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/volume-toolkit
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integrity dependencies
        run: python -m pip install 'jsonschema>=4.18'
      - name: Check materialized artifacts and provenance
        run: python scripts/check_data_integrity.py --require-materialized
