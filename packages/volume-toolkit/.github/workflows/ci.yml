# Continuous Integration
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Verify imports
        run: |
          python -c "from ideal_poly_volume_toolkit import geometry, rivin_delaunay; print('Imports OK')"

      - name: Construct GUI and HF app
        if: matrix.python-version == '3.14'
        run: |
          python -c "from bin.gui import create_gui; assert create_gui() is not None"
          python -c "import app; assert app.demo is not None"

  data-integrity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install data-integrity dependencies
        run: python3 -m pip install 'jsonschema>=4.18'

      - name: Verify Git LFS and result provenance
        run: python3 scripts/check_data_integrity.py --require-materialized
