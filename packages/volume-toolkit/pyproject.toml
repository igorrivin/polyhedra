[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ideal_poly_volume_toolkit"
version = "0.3.0"
description = "Geometry, volume, and optimization tools for ideal hyperbolic polyhedra."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy",
    "scipy",
    "mpmath",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/igorrivin/ideal_poly_volume_toolkit"
Repository = "https://github.com/igorrivin/ideal_poly_volume_toolkit"
Issues = "https://github.com/igorrivin/ideal_poly_volume_toolkit/issues"

[project.scripts]
ideal-poly-optimize = "ideal_poly_volume_toolkit.optimization_cli:main"

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
plot = [
    "matplotlib",
    "plotly",
]
gui = [
    "gradio>=6,<7",
    "matplotlib",
    "plotly",
    "Pillow",
]
graph = [
    "pynauty",
    "networkx",
]
render = [
    "trimesh",
    "pyrender",
    "imageio",
]
rl = [
    "gymnasium",
    "cma",
    "stable-baselines3",
    "torch>=2.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "jsonschema>=4.18",
    "ruff",
    "build",
    "torch>=2.0",
    "gradio>=6,<7",
    "matplotlib",
    "plotly",
    "Pillow",
    "pynauty",
    "networkx",
    "gymnasium",
    "cma",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ideal_poly_volume_toolkit*"]
exclude = ["examples*", "results*", "scripts*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
